services:
  app:
    image: richeschiu/mova:latest
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "36080:36080"
    environment:
      # Optional: TMDB API Read Access Token. Leave empty to skip remote metadata scraping.
      MOVA_TMDB_ACCESS_TOKEN: ""
      # Optional: uncomment when MOVA must use a proxy running on the Docker host.
      # HTTP_PROXY: "http://host.docker.internal:7890"
      # HTTPS_PROXY: "http://host.docker.internal:7890"
    # Required on Linux when the optional host proxy above is enabled.
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    volumes:
      - ./data/cache:/app/data/cache
      - type: bind
        # Replace with the absolute media directory on the Docker host.
        source: /absolute/path/to/media
        target: /media
        read_only: true
    restart: unless-stopped

  database:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mova
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mova
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mova -d mova"]
      interval: 5s
      timeout: 5s
      retries: 12
    shm_size: 256mb
    restart: unless-stopped
