name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: mova-release
  queue: max
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: richeschiu/mova
  WEB_BUILD_BASE_TAG: richeschiu/mova-web-build-base:node24-pnpm11
  RUST_BUILD_BASE_TAG: richeschiu/mova-rust-build-base:1-bookworm
  RUNTIME_BASE_TAG: richeschiu/mova-runtime-base:trixie-ffmpeg-f944afd
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  prepare:
    name: Prepare release
    # A successful CI gate is either a full master run or a fail-closed proof
    # that this exact master tree already passed every required gate on its PR.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      previous_tag: ${{ steps.release.outputs.previous_tag }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
      channel: ${{ steps.release.outputs.channel }}
      release_notes_file: ${{ steps.release.outputs.release_notes_file }}
      candidate_stem: ${{ steps.release.outputs.candidate_stem }}
      reuse: ${{ steps.image.outputs.reuse }}
      image_digest: ${{ steps.image.outputs.digest }}
      web_build_ref: ${{ steps.build_bases.outputs.web_ref }}
      web_build_digest: ${{ steps.build_bases.outputs.web_digest }}
      rust_build_ref: ${{ steps.build_bases.outputs.rust_ref }}
      rust_build_digest: ${{ steps.build_bases.outputs.rust_digest }}
      runtime_ref: ${{ steps.runtime.outputs.ref }}
      runtime_digest: ${{ steps.runtime.outputs.digest }}
      runtime_oldest_created: ${{ steps.runtime.outputs.oldest_created }}
    steps:
      - name: Check out verified master revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Resolve release metadata
        id: release
        run: |
          set -euo pipefail

          source ./scripts/lib/release-subject.sh
          version="$(./scripts/resolve-release-version.sh)"
          release_notes_file=".github/release-notes/${version}.md"

          tag="v${version}"
          tag_exists=false
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            tag_exists=true
            tag_revision="$(git rev-parse "${tag}^{commit}")"
            if [[ "$tag_revision" != "$SOURCE_SHA" ]]; then
              echo "Version $version is already released from $tag_revision; nothing to publish."
              echo "should_release=false" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$(git cat-file -t "refs/tags/${tag}")" != "tag" ]]; then
              echo "Existing release tag ${tag} must be annotated." >&2
              exit 1
            fi
          else
            expected_subject="chore(release): prepare ${version}"
            actual_subject="$(git log -1 --format=%s)"
            if ! mova_release_subject_matches "$actual_subject" "$expected_subject"; then
              echo "The untagged version belongs to an earlier release commit; this revision does not publish it."
              echo "should_release=false" >>"$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [[ "$version" == *-* ]]; then
            newest_channel_version="$(
              git tag --list 'v*-*' \
                | sed 's/^v//' \
                | sort --version-sort \
                | tail -1
            )"
          else
            newest_channel_version="$(
              git tag --list 'v*' \
                | grep -v -- '-' \
                | sed 's/^v//' \
                | sort --version-sort \
                | tail -1 \
                || true
            )"
          fi
          if [[ -n "$newest_channel_version" && "$newest_channel_version" != "$version" ]]; then
            highest_version="$(
              printf '%s\n%s\n' "$newest_channel_version" "$version" \
                | sort --version-sort \
                | tail -1
            )"
            if [[ "$highest_version" == "$newest_channel_version" ]]; then
              echo "Release $version is superseded by $newest_channel_version; nothing to publish."
              echo "should_release=false" >>"$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          previous_tag="$(
            git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || true
          )"
          if [[ -n "$previous_tag" ]]; then
            release_range="${previous_tag}..HEAD"
          else
            release_range="HEAD"
          fi

          migration_summary="No database migration is included. No media rescan or cache rebuild is required unless the release notes explicitly say otherwise."
          if git diff --name-only "$release_range" -- migrations/ | grep -q .; then
            migration_summary="Bundled database migrations apply automatically at startup. Review the release notes for any explicit media rescan or cache rebuild requirement."
          fi

          {
            printf 'Mova %s\n\n' "$version"
            printf 'Changes:\n'
            git log --first-parent --pretty='- %s' "$release_range"
            if [[ -f "$release_notes_file" ]]; then
              printf '\nRelease notes:\n\n'
              git show "${SOURCE_SHA}:${release_notes_file}"
              printf '\n'
            fi
            printf '\nVerification: GitHub Actions CI passed for master revision %s.\n' "$SOURCE_SHA"
            printf 'Migration: %s\n' "$migration_summary"
          } > /tmp/mova-release-tag-message.txt

          is_prerelease=false
          channel=latest
          if [[ "$version" == *-* ]]; then
            is_prerelease=true
            channel=preview
          fi

          {
            echo "should_release=true"
            echo "version=$version"
            echo "tag=$tag"
            echo "tag_exists=$tag_exists"
            echo "previous_tag=$previous_tag"
            echo "is_prerelease=$is_prerelease"
            echo "channel=$channel"
            echo "release_notes_file=$release_notes_file"
            echo "candidate_stem=publish-${version}-${SOURCE_SHA:0:12}-${GITHUB_RUN_ID}"
          } >>"$GITHUB_OUTPUT"

      - name: Validate Docker Hub credentials
        if: steps.release.outputs.should_release == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "DOCKERHUB_USERNAME variable and DOCKERHUB_TOKEN secret are required." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        if: steps.release.outputs.should_release == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        if: steps.release.outputs.should_release == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Inspect immutable image
        if: steps.release.outputs.should_release == 'true'
        id: image
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          image_ref="${IMAGE_REPOSITORY}:${VERSION}"
          if digest="$(
            docker buildx imagetools inspect "$image_ref" \
              --format '{{.Manifest.Digest}}' 2>/dev/null
          )"; then
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Existing immutable image has an invalid digest: $digest" >&2
              exit 1
            fi
            pinned_ref="${IMAGE_REPOSITORY}@${digest}"
            source scripts/lib/docker-platform-image.sh
            validate_platform_image_identity \
              "$pinned_ref" linux/amd64 "$VERSION" "$SOURCE_SHA"
            validate_platform_image_identity \
              "$pinned_ref" linux/arm64 "$VERSION" "$SOURCE_SHA"
            source scripts/lib/docker-attestation-policy.sh
            validate_attested_image_index "$pinned_ref" linux/amd64,linux/arm64

            echo "Reusing verified immutable image ${pinned_ref}."
            echo "reuse=true" >>"$GITHUB_OUTPUT"
            echo "digest=$digest" >>"$GITHUB_OUTPUT"
          else
            echo "reuse=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Validate runtime base image
        if: >-
          steps.release.outputs.should_release == 'true' &&
          steps.image.outputs.reuse == 'false'
        id: runtime
        run: |
          set -euo pipefail

          digest="$(
            docker buildx imagetools inspect "$RUNTIME_BASE_TAG" \
              --format '{{.Manifest.Digest}}'
          )"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Runtime base has an invalid manifest digest: $digest" >&2
            exit 1
          fi

          runtime_repository="${RUNTIME_BASE_TAG%:*}"
          pinned_ref="${runtime_repository}@${digest}"
          image_metadata="$(
            docker buildx imagetools inspect "$pinned_ref" --format '{{json .Image}}'
          )"
          if ! jq -e '
            keys == ["linux/amd64", "linux/arm64"] and
            .["linux/amd64"].os == "linux" and
            .["linux/amd64"].architecture == "amd64" and
            .["linux/arm64"].os == "linux" and
            .["linux/arm64"].architecture == "arm64" and
            all(.[]; (.created | type) == "string")
          ' <<<"$image_metadata" >/dev/null; then
            echo "Runtime base must contain exactly linux/amd64 and linux/arm64 images." >&2
            exit 1
          fi

          oldest_created_epoch="$(
            jq -r '[.[] | .created | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601] | min' \
              <<<"$image_metadata"
          )"
          newest_created_epoch="$(
            jq -r '[.[] | .created | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601] | max' \
              <<<"$image_metadata"
          )"
          oldest_created="$(date --utc --date="@${oldest_created_epoch}" '+%Y-%m-%dT%H:%M:%SZ')"
          now_epoch="$(date +%s)"
          max_age_seconds=$((192 * 60 * 60))
          age_seconds=$((now_epoch - oldest_created_epoch))

          if ((newest_created_epoch > now_epoch + 300)); then
            echo "Runtime base has a future creation timestamp." >&2
            exit 1
          fi
          if ((age_seconds < 0 || age_seconds > max_age_seconds)); then
            age_hours=$((age_seconds / 3600))
            echo "Runtime base is stale: oldest=${oldest_created}, age=${age_hours}h, limit=192h." >&2
            echo "Refresh and verify the runtime base before publishing an application release." >&2
            exit 1
          fi

          age_hours=$((age_seconds / 3600))
          echo "Using runtime base ${pinned_ref}; oldest platform age=${age_hours}h."
          {
            echo "ref=$pinned_ref"
            echo "digest=$digest"
            echo "oldest_created=$oldest_created"
          } >>"$GITHUB_OUTPUT"

      - name: Pin build base images
        if: >-
          steps.release.outputs.should_release == 'true' &&
          steps.image.outputs.reuse == 'false'
        id: build_bases
        run: |
          set -euo pipefail

          pin_base_image() {
            local tag="$1"
            local output_prefix="$2"
            local digest
            local repository
            local pinned_ref
            local image_metadata

            digest="$(
              docker buildx imagetools inspect "$tag" \
                --format '{{.Manifest.Digest}}'
            )"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Build base has an invalid manifest digest: ${tag} => ${digest}" >&2
              return 1
            fi
            repository="${tag%:*}"
            pinned_ref="${repository}@${digest}"
            image_metadata="$(
              docker buildx imagetools inspect "$pinned_ref" --format '{{json .Image}}'
            )"
            if ! jq -e '
              keys == ["linux/amd64", "linux/arm64"] and
              .["linux/amd64"].os == "linux" and
              .["linux/amd64"].architecture == "amd64" and
              .["linux/arm64"].os == "linux" and
              .["linux/arm64"].architecture == "arm64"
            ' <<<"$image_metadata" >/dev/null; then
              echo "Build base must contain exactly linux/amd64 and linux/arm64: $tag" >&2
              return 1
            fi
            {
              echo "${output_prefix}_ref=$pinned_ref"
              echo "${output_prefix}_digest=$digest"
            } >>"$GITHUB_OUTPUT"
          }

          pin_base_image "$WEB_BUILD_BASE_TAG" web
          pin_base_image "$RUST_BUILD_BASE_TAG" rust

      - name: Create annotated release tag locally
        if: >-
          steps.release.outputs.should_release == 'true' &&
          steps.release.outputs.tag_exists == 'false'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" --file /tmp/mova-release-tag-message.txt

      - name: Push annotated Git tag
        if: >-
          steps.release.outputs.should_release == 'true' &&
          steps.release.outputs.tag_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: >-
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          push "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}"

  build_platform:
    name: Build ${{ matrix.platform }}
    needs: prepare
    if: >-
      needs.prepare.outputs.should_release == 'true' &&
      needs.prepare.outputs.reuse == 'false'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out verified release revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve platform candidate tag
        id: candidate
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
          CANDIDATE_STEM: ${{ needs.prepare.outputs.candidate_stem }}
        run: |
          candidate_tag="${CANDIDATE_STEM}-${ARCH}"
          echo "tag=${IMAGE_REPOSITORY}:${candidate_tag}" >>"$GITHUB_OUTPUT"

      - name: Build and push platform candidate
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/mova-server/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          pull: true
          tags: ${{ steps.candidate.outputs.tag }}
          build-args: |
            MOVA_BUILD_VERSION=${{ needs.prepare.outputs.version }}
            MOVA_BUILD_REVISION=${{ env.SOURCE_SHA }}
            MOVA_WEB_BUILD_BASE=${{ needs.prepare.outputs.web_build_ref }}
            MOVA_RUST_BUILD_BASE=${{ needs.prepare.outputs.rust_build_ref }}
            MOVA_RUNTIME_BASE=${{ needs.prepare.outputs.runtime_ref }}
          cache-from: type=gha,scope=mova-release-app-${{ matrix.arch }}-v1
          cache-to: type=gha,scope=mova-release-app-${{ matrix.arch }}-v1,mode=max,ignore-error=true
          provenance: mode=max
          sbom: true

      - name: Verify platform candidate identity
        env:
          CANDIDATE_TAG: ${{ steps.candidate.outputs.tag }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail

          digest="$(
            docker buildx imagetools inspect "$CANDIDATE_TAG" \
              --format '{{.Manifest.Digest}}'
          )"
          if [[ "$digest" != "$EXPECTED_DIGEST" ]]; then
            echo "Platform candidate digest mismatch: expected=$EXPECTED_DIGEST actual=$digest" >&2
            exit 1
          fi
          pinned_ref="${IMAGE_REPOSITORY}@${digest}"
          source scripts/lib/docker-platform-image.sh
          validate_platform_image_identity \
            "$pinned_ref" "$PLATFORM" "$VERSION" "$SOURCE_SHA"
          source scripts/lib/docker-attestation-policy.sh
          validate_attested_image_index "$pinned_ref" "$PLATFORM"

      - name: Smoke-test platform candidate
        env:
          CANDIDATE_TAG: ${{ steps.candidate.outputs.tag }}
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          candidate_repository="${CANDIDATE_TAG%:*}"
          ./scripts/smoke-test-runtime-image.sh \
            "${candidate_repository}@${CANDIDATE_DIGEST}" \
            "$PLATFORM"

  publish:
    name: Publish release
    needs:
      - prepare
      - build_platform
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.should_release == 'true' &&
      (needs.prepare.outputs.reuse == 'true' || needs.build_platform.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Check out verified release revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch and verify annotated release tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git cat-file -t "refs/tags/${TAG}")" = "tag"
          test "$(git rev-parse "${TAG}^{commit}")" = "$SOURCE_SHA"

      - name: Set up QEMU for cross-platform re-verification
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install Docker Scout
        env:
          SCOUT_VERSION: 1.24.0
          SCOUT_ARCHIVE_SHA256: f4e2814bd61040365153d5b964b144cb2dc6ee536a68b5bac4cadf00fc0ec34b
        run: |
          scout_archive="/tmp/docker-scout_${SCOUT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/docker/scout-cli/releases/download/v${SCOUT_VERSION}/docker-scout_${SCOUT_VERSION}_linux_amd64.tar.gz" \
            --output "$scout_archive"
          echo "${SCOUT_ARCHIVE_SHA256}  ${scout_archive}" | sha256sum --check
          mkdir -p "$HOME/.docker/cli-plugins" /tmp/docker-scout
          tar --extract --gzip --file "$scout_archive" --directory /tmp/docker-scout
          install -m 0755 /tmp/docker-scout/docker-scout \
            "$HOME/.docker/cli-plugins/docker-scout"
          docker scout version

      - name: Resolve image to verify
        id: source
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          REUSE: ${{ needs.prepare.outputs.reuse }}
          REUSED_DIGEST: ${{ needs.prepare.outputs.image_digest }}
          CANDIDATE_STEM: ${{ needs.prepare.outputs.candidate_stem }}
        run: |
          set -euo pipefail

          if [[ "$REUSE" == "true" ]]; then
            digest="$REUSED_DIGEST"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Reusable immutable image has an invalid digest: $digest" >&2
              exit 1
            fi
            echo "Reverifying existing immutable image ${IMAGE_REPOSITORY}@${digest}."
            {
              echo "digest=$digest"
              echo "ref=${IMAGE_REPOSITORY}@${digest}"
              echo "candidate_tag="
              echo "amd64_tag="
              echo "arm64_tag="
            } >>"$GITHUB_OUTPUT"
            exit 0
          fi

          amd64_tag="${IMAGE_REPOSITORY}:${CANDIDATE_STEM}-amd64"
          arm64_tag="${IMAGE_REPOSITORY}:${CANDIDATE_STEM}-arm64"
          candidate_tag="${IMAGE_REPOSITORY}:${CANDIDATE_STEM}"

          amd64_digest="$(
            docker buildx imagetools inspect "$amd64_tag" \
              --format '{{.Manifest.Digest}}'
          )"
          arm64_digest="$(
            docker buildx imagetools inspect "$arm64_tag" \
              --format '{{.Manifest.Digest}}'
          )"
          for digest in "$amd64_digest" "$arm64_digest"; do
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Platform candidate has an invalid digest: $digest" >&2
              exit 1
            fi
          done

          docker buildx imagetools create \
            --tag "$candidate_tag" \
            "${IMAGE_REPOSITORY}@${amd64_digest}" \
            "${IMAGE_REPOSITORY}@${arm64_digest}"

          digest="$(
            docker buildx imagetools inspect "$candidate_tag" \
              --format '{{.Manifest.Digest}}'
          )"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Combined candidate has an invalid digest: $digest" >&2
            exit 1
          fi
          pinned_ref="${IMAGE_REPOSITORY}@${digest}"
          source scripts/lib/docker-platform-image.sh
          validate_platform_image_identity \
            "$pinned_ref" linux/amd64 "$VERSION" "$SOURCE_SHA"
          validate_platform_image_identity \
            "$pinned_ref" linux/arm64 "$VERSION" "$SOURCE_SHA"
          source scripts/lib/docker-attestation-policy.sh
          validate_attested_image_index "$pinned_ref" linux/amd64,linux/arm64

          {
            echo "digest=$digest"
            echo "ref=$pinned_ref"
            echo "candidate_tag=$candidate_tag"
            echo "amd64_tag=$amd64_tag"
            echo "arm64_tag=$arm64_tag"
          } >>"$GITHUB_OUTPUT"

      - name: Reverify exact multi-platform image
        env:
          MOVA_DOCKER_IMAGE_TAG: ${{ env.IMAGE_REPOSITORY }}:${{ needs.prepare.outputs.version }}
          MOVA_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          MOVA_DOCKER_PLATFORMS: linux/amd64,linux/arm64
          MOVA_VERIFY_IMAGE_REF: ${{ steps.source.outputs.ref }}
          MOVA_ACCEPT_UNFIXED_CVES: ${{ vars.MOVA_ACCEPT_UNFIXED_CVES }}
          DOCKER_SCOUT_HUB_USER: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKER_SCOUT_HUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: ./scripts/publish-docker-images.sh

      - name: Promote immutable image
        if: needs.prepare.outputs.reuse == 'false'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          VERIFIED_REF: ${{ steps.source.outputs.ref }}
          VERIFIED_DIGEST: ${{ steps.source.outputs.digest }}
        run: |
          set -euo pipefail

          immutable_ref="${IMAGE_REPOSITORY}:${VERSION}"
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$immutable_ref" \
            "$VERIFIED_REF"
          published_digest="$(
            docker buildx imagetools inspect "$immutable_ref" \
              --format '{{.Manifest.Digest}}'
          )"
          if [[ "$published_digest" != "$VERIFIED_DIGEST" ]]; then
            echo "Published digest mismatch: expected=$VERIFIED_DIGEST actual=$published_digest" >&2
            exit 1
          fi

      - name: Resolve published image digest
        id: published
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_DIGEST: ${{ steps.source.outputs.digest }}
        run: |
          set -euo pipefail

          image_ref="${IMAGE_REPOSITORY}:${VERSION}"
          digest="$(
            docker buildx imagetools inspect "$image_ref" \
              --format '{{.Manifest.Digest}}'
          )"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve immutable image digest: $digest" >&2
            exit 1
          fi
          if [[ "$digest" != "$EXPECTED_DIGEST" ]]; then
            echo "Immutable image digest mismatch: expected=$EXPECTED_DIGEST actual=$digest" >&2
            exit 1
          fi
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
          DIGEST: ${{ steps.published.outputs.digest }}
          RELEASE_NOTES_FILE: ${{ needs.prepare.outputs.release_notes_file }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; preserving it for retry."
            exit 0
          fi

          release_notes="Docker image: \`${IMAGE_REPOSITORY}:${VERSION}\` (\`${DIGEST}\`)"
          if [[ -f "$RELEASE_NOTES_FILE" ]]; then
            release_notes="$(git show "${SOURCE_SHA}:${RELEASE_NOTES_FILE}")"$'\n\n'"$release_notes"
          fi

          release_args=(
            release create "$TAG"
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --draft
            --generate-notes
            --title "Mova ${VERSION}"
            --notes "$release_notes"
          )
          if [[ -n "$PREVIOUS_TAG" ]]; then
            release_args+=(--notes-start-tag "$PREVIOUS_TAG")
          fi
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease --latest=false)
          else
            release_args+=(--latest=false)
          fi
          gh "${release_args[@]}"

      - name: Promote channel alias
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          DIGEST: ${{ steps.published.outputs.digest }}
        run: |
          set -euo pipefail

          alias_ref="${IMAGE_REPOSITORY}:${CHANNEL}"
          immutable_ref="${IMAGE_REPOSITORY}@${DIGEST}"
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$alias_ref" \
            "$immutable_ref"
          alias_digest="$(
            docker buildx imagetools inspect "$alias_ref" \
              --format '{{.Manifest.Digest}}'
          )"
          if [[ "$alias_digest" != "$DIGEST" ]]; then
            echo "Channel alias digest mismatch: expected=$DIGEST actual=$alias_digest" >&2
            exit 1
          fi
          docker buildx imagetools inspect "$alias_ref"

      - name: Publish GitHub Release
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
        run: |
          is_draft="$(
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft --jq '.isDraft'
          )"
          if [[ "$is_draft" != "true" ]]; then
            echo "GitHub Release $TAG is already published."
            echo "published_now=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft=false --prerelease=false --latest
          fi
          echo "published_now=true" >>"$GITHUB_OUTPUT"

      - name: Notify Telegram
        if: steps.github_release.outputs.published_now == 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DIGEST: ${{ steps.published.outputs.digest }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
        run: >-
          ./scripts/notify-telegram-release.sh
          "$VERSION"
          "$CHANNEL"
          "$TAG"
          "$DIGEST"
          "$IS_PRERELEASE"

      - name: Remove promoted release candidate tags
        if: needs.prepare.outputs.reuse == 'false'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          MOVA_DOCKER_REPOSITORY: ${{ env.IMAGE_REPOSITORY }}
          CANDIDATE_TAG: ${{ steps.source.outputs.candidate_tag }}
          AMD64_TAG: ${{ steps.source.outputs.amd64_tag }}
          ARM64_TAG: ${{ steps.source.outputs.arm64_tag }}
        run: |
          cleanup_failed=false
          for candidate_tag in "$CANDIDATE_TAG" "$AMD64_TAG" "$ARM64_TAG"; do
            if ! ./scripts/cleanup-docker-candidate-tags.sh exact "${candidate_tag##*:}"; then
              echo "::warning::Candidate tag $candidate_tag could not be deleted; scheduled cleanup will retry."
              cleanup_failed=true
            fi
          done
          if [[ "$cleanup_failed" == "true" ]]; then
            echo "One or more candidate tags remain for scheduled cleanup."
          fi

      - name: Summarize release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          DIGEST: ${{ steps.published.outputs.digest }}
          RUNTIME_DIGEST: ${{ needs.prepare.outputs.runtime_digest }}
          RUNTIME_CREATED: ${{ needs.prepare.outputs.runtime_oldest_created }}
          WEB_BUILD_DIGEST: ${{ needs.prepare.outputs.web_build_digest }}
          RUST_BUILD_DIGEST: ${{ needs.prepare.outputs.rust_build_digest }}
        run: |
          {
            echo "## Mova ${VERSION}"
            echo
            echo "- Immutable image: \`${IMAGE_REPOSITORY}:${VERSION}\`"
            echo "- Channel alias: \`${IMAGE_REPOSITORY}:${CHANNEL}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
            if [[ -n "$RUNTIME_DIGEST" ]]; then
              echo "- Web build base digest: \`${WEB_BUILD_DIGEST}\`"
              echo "- Rust build base digest: \`${RUST_BUILD_DIGEST}\`"
              echo "- Runtime base digest: \`${RUNTIME_DIGEST}\`"
              echo "- Oldest runtime platform created: \`${RUNTIME_CREATED}\`"
            fi
          } >>"$GITHUB_STEP_SUMMARY"
