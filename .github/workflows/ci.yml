name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.8 --activate

      - name: Install dependencies
        run: pnpm --dir apps/mova-web install --frozen-lockfile

      - name: Test
        run: pnpm --dir apps/mova-web test

      - name: Check
        run: pnpm --dir apps/mova-web check

      - name: Build
        run: pnpm --dir apps/mova-web build

  site:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mova-site/package-lock.json

      - name: Install dependencies
        run: npm --prefix apps/mova-site ci

      - name: Check API documentation
        run: npm --prefix apps/mova-site run check:api-docs

      - name: Lint
        run: npm --prefix apps/mova-site run lint

      - name: Typecheck
        run: npm --prefix apps/mova-site run typecheck

      - name: Build
        run: npm --prefix apps/mova-site run build

  rust:
    name: Rust and PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: mova
          POSTGRES_USER: mova
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mova -d mova"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://mova:postgres@127.0.0.1:5432/mova
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Validate release metadata
        env:
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
        run: |
          version="$(./scripts/resolve-release-version.sh)"
          tag="v${version}"
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            exit 0
          fi

          expected_subject="chore(release): prepare ${version}"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            actual_subject="$PR_TITLE"
          else
            actual_subject="$(git log -1 --format=%s)"
          fi
          if [[ "$actual_subject" == "$expected_subject" ]]; then
            exit 0
          fi
          if git log --format=%s | grep --fixed-strings --line-regexp --quiet "$expected_subject"; then
            exit 0
          fi
          echo "An untagged workspace version requires a dedicated release change." >&2
          echo "Expected subject: $expected_subject" >&2
          echo "Actual subject:   $actual_subject" >&2
          exit 1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked -- --include-ignored --test-threads=1

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate Compose configurations
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose --env-file .env.example -f compose.source.yaml config --quiet

      - name: Validate shell scripts
        run: |
          bash -n scripts/*.sh scripts/lib/*.sh scripts/tests/*.sh
          ./scripts/tests/test-cleanup-docker-candidate-tags.sh
          ./scripts/tests/test-docker-attestation-policy.sh
          ./scripts/tests/test-docker-build-policy.sh
          ./scripts/tests/test-docker-platform-image.sh

      - name: Build Web base image
        run: >-
          docker build
          --file docker/base/web-build.Dockerfile
          --tag mova-web-build-base:ci
          .

      - name: Build Rust base image
        run: >-
          docker build
          --file docker/base/rust-build.Dockerfile
          --tag mova-rust-build-base:ci
          .

      - name: Build runtime base image
        run: >-
          docker build
          --file docker/base/runtime.Dockerfile
          --tag mova-runtime-base:ci
          .

      - name: Build image
        run: >-
          docker build
          --file apps/mova-server/Dockerfile
          --build-arg MOVA_WEB_BUILD_BASE=mova-web-build-base:ci
          --build-arg MOVA_RUST_BUILD_BASE=mova-rust-build-base:ci
          --build-arg MOVA_RUNTIME_BASE=mova-runtime-base:ci
          --build-arg MOVA_BUILD_VERSION=ci-${{ github.sha }}
          --build-arg MOVA_BUILD_REVISION=${{ github.sha }}
          --tag mova:ci
          .

      - name: Verify image revision
        run: >-
          test "$(docker image inspect mova:ci
          --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          = "${{ github.sha }}"

      - name: Test runtime tools
        run: ./scripts/smoke-test-runtime-image.sh mova:ci linux/amd64
